<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Person Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { padding: 10px; border: 1px solid #ccc; text-align: left; }
        th { background-color: #f4f4f4; }
        form { margin-bottom: 20px; }
    </style>
</head>
<body>
    <h2>Person Management System</h2>

    <!-- Form to add a new person -->
    <form id="person-form">
        <input type="hidden" id="person-id">
        <label>Name: <input type="text" id="name" required></label>
        <label>Age: <input type="number" id="age" required></label>
        <label>Gender:
            <select id="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </label>
        <label>Mobile Number: <input type="text" id="mobile" required></label>
        <button type="submit">Submit</button>
    </form>

    <!-- Table displaying persons -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Mobile</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="person-list"></tbody>
    </table>

    <script>
        const apiUrl = "http://localhost:3000/person";

        async function fetchPersons() {
            const response = await fetch(apiUrl);
            const persons = await response.json();
            const list = document.getElementById("person-list");
            list.innerHTML = persons.map(person => `
                <tr>
                    <td>${person.id}</td>
                    <td>${person.name}</td>
                    <td>${person.age}</td>
                    <td>${person.gender}</td>
                    <td>${person.mobile}</td>
                    <td>
                        <button onclick="editPerson(${person.id}, '${person.name}', ${person.age}, '${person.gender}', '${person.mobile}')">Edit</button>
                        <button onclick="deletePerson(${person.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        async function submitForm(event) {
            event.preventDefault();
            const id = document.getElementById("person-id").value;
            const personData = {
                name: document.getElementById("name").value,
                age: document.getElementById("age").value,
                gender: document.getElementById("gender").value,
                mobile: document.getElementById("mobile").value
            };

            if (id) {
                await fetch(`${apiUrl}/${id}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(personData) });
            } else {
                await fetch(apiUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(personData) });
            }

            document.getElementById("person-form").reset();
            fetchPersons();
        }

        async function deletePerson(id) {
            await fetch(`${apiUrl}/${id}`, { method: "DELETE" });
            fetchPersons();
        }

        function editPerson(id, name, age, gender, mobile) {
            document.getElementById("person-id").value = id;
            document.getElementById("name").value = name;
            document.getElementById("age").value = age;
            document.getElementById("gender").value = gender;
            document.getElementById("mobile").value = mobile;
        }

        document.getElementById("person-form").addEventListener("submit", submitForm);
        fetchPersons();
    </script>
</body>
</html>
